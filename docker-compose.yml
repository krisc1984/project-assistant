version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aibot
    ports:
      - "5432:5432"
  aibot:
    image: node:18
    command: bash -lc "sleep 1 && echo 'ready'"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/aibot
