name: Phase 2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: aibot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U user -d aibot -p 5432 || exit 1
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          npm ci --silent
      - name: Run migrations (actual)
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/aibot
        run: |
          node ./backend/scripts/migrate.js
      - name: Run tests (with coverage)
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/aibot
        run: |
          npm test --silent --workspaces --if-present -- --coverage
